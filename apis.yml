aid: notyfi
name: Notyfi
description: >-
  Notyfi is a natural-language monitoring and notification service built by Perceptron ML
  (Y Combinator). Describe what to watch in one sentence -- new lawsuits, layoffs, price
  drops, listings, RFPs, breaking news -- and Notyfi watches the news, filings, databases,
  and the open web for it, delivering deduplicated canonical events instantly, hourly,
  daily, or weekly by email, on a live dashboard, or into agents and workflows via a REST
  API and a hosted MCP server. The API exposes persistent trackers, their event feeds,
  HMAC-signed outgoing webhooks, API-key management, account, and Stripe-backed billing.
  Authenticate with a Notyfi API key (Authorization: Bearer notyfi_mk_... or X-Api-Key).
