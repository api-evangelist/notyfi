          title: External Id
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        reported_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Reported At
        ingested_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Ingested At
        content_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Hash
      type: object
      required:
      - observation_id
      - source_key
      title: FeedEventSource
      description: One observation supporting a canonical consumer-feed event revision.
